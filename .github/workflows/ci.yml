# Test and lint gate for every push and PR. The library itself needs no
# services; cmd/recall's integration tests run a real polign-server from the
# latest polign_db wheel, so the HTTP contract Recall depends on is checked
# against what users install. A PostgreSQL service and a MongoDB replica set
# run those backends' conformance suites. Separate jobs run govulncheck on the
# source and the built binary, and build and smoke-test the container image,
# so a release cannot ship a known vulnerability or an image that does not
# build (0.18.0 through 0.20.2 shipped without one).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: recall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install polign-server
        run: |
          python -m pip install --upgrade polign_db
          echo "POLIGN_SERVER_BIN=$(python -c 'import polign_db; print(polign_db.find_bin("polign-server"))')" >> "$GITHUB_ENV"

      # A single-node replica set, so fenced agent writes run as transactions
      # the way they do on Atlas. Service containers cannot run rs.initiate,
      # so this is a plain docker run.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          sleep 3

      - name: Test (race)
        env:
          RECALL_REQUIRE_POLIGN: "1"
          RECALL_PGVECTOR_URL: postgres://postgres:recall@localhost:5432/postgres
          RECALL_MONGODB_URL: mongodb://localhost:27017/?directConnection=true
        run: go test -race -timeout 10m ./...

      - name: Wheel builder tests
        run: python -m unittest discover -s packaging/tests -v

      # The installed-binary path end to end: recall setup with a managed
      # local polign-server, its launcher, doctor, crash recovery, and the
      # Python client across server restarts.
      - name: Setup and restart, end to end
        run: |
          go build -o "$RUNNER_TEMP/recall" ./cmd/recall
          python tests/setup_e2e.py "$RUNNER_TEMP/recall" "$POLIGN_SERVER_BIN"
          python -m pip install --no-deps ./python
          RECALL_TEST_POLIGN="$RUNNER_TEMP/recall" RECALL_TEST_SERVER="$POLIGN_SERVER_BIN" python python/tests/restart.py

      - name: Release config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test Python package
        run: |
          # The tests run the client against stand-in servers, so the binary
          # wheels it depends on (which a release publishes) are not needed.
          python -m pip install --no-deps ./python
          python -m unittest discover -s python/tests -v

  # Blocks on any vulnerability govulncheck can show the binary reaches, in a
  # dependency or in the standard library. go.mod's toolchain line is what
  # keeps the standard library current; bump it when this job goes red.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck (source)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: govulncheck (release binary)
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/recall" ./cmd/recall
          go version "$RUNNER_TEMP/recall"
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode binary "$RUNNER_TEMP/recall"

  # The container image, built the way container-release.yml builds it and
  # smoke-tested against a real polign-server, without pushing anything.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install polign-server for the smoke test
        run: |
          python -m pip install --upgrade polign_db
          echo "POLIGN_SERVER_BIN=$(python -c 'import polign_db; print(polign_db.find_bin("polign-server"))')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image
        run: docker buildx build --load --platform linux/amd64 -f deploy/container/Dockerfile -t recall:ci .
      - name: Smoke test
        run: bash deploy/container/smoke.sh recall:ci "$POLIGN_SERVER_BIN"
