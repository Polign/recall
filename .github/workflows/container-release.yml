# Publishes ghcr.io/polign/recall for a released version. Runs by itself when
# a GitHub release is published (release.yml creates it), or by hand for a
# version that already exists. The image is built from the tagged source,
# smoke-tested against a real polign-server before anything is pushed, then
# published for both architectures with provenance and an SBOM, signed with
# Sigstore, and checked to be readable anonymously.
name: container-release
run-name: Recall container ${{ inputs.version || github.event.release.tag_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published release (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: container-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      # Two checkouts: this workflow's own commit for the tooling (the
      # Dockerfile and the smoke test may be newer than the release), and the
      # released tag into src/ for the source the image is built from.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
          path: src
      - name: Set image version
        run: |
          case "$RELEASE_TAG" in v*) ;; *) echo "::error::version must look like vX.Y.Z, got $RELEASE_TAG"; exit 1 ;; esac
          echo "IMAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install polign-server for the smoke test
        run: |
          python -m pip install --upgrade polign_db
          echo "POLIGN_SERVER_BIN=$(python -c 'import polign_db; print(polign_db.find_bin("polign-server"))')" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image for the smoke test
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-arg VERSION="$RELEASE_TAG" \
            -f deploy/container/Dockerfile -t recall:release-check src
      - name: Smoke test against a real polign-server
        run: bash deploy/container/smoke.sh recall:release-check "$POLIGN_SERVER_BIN" "$RELEASE_TAG"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish both architectures
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src
          file: deploy/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/polign/recall:${{ env.IMAGE_VERSION }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          provenance: true
          sbom: true
      - name: Sign the published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/polign/recall@$IMAGE_DIGEST"
      - name: Verify anonymous access
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous" docker manifest inspect "ghcr.io/polign/recall@$IMAGE_DIGEST" >/dev/null
          echo "Published ghcr.io/polign/recall:$IMAGE_VERSION ($IMAGE_DIGEST)" >> "$GITHUB_STEP_SUMMARY"
