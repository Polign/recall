[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polign-recall"
version = "0.24.0"
description = "Memory and state for AI agents: corrections kept with history, and agents that resume from their own records"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Polign"}]
dependencies = [
    # `polign-server`, the database a managed local store runs, as platform
    # wheels. The marker covers exactly the platforms those wheels exist for,
    # so an install anywhere else still succeeds. The `recall` binary itself
    # ships inside this package's own platform wheels.
    "polign_db>=0.12.0; (sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64')",
]

[project.urls]
Repository = "https://github.com/Polign/recall"

[tool.setuptools.package-data]
polign_recall = ["py.typed"]
