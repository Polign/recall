[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polign-recall"
version = "0.3.1"
description = "Typed, correctable agent memory through Recall's MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Polign"}]
dependencies = [
    # The `polign` CLI and `polign-server`, as platform wheels. The marker
    # covers exactly the platforms those wheels exist for, so an install
    # anywhere else still succeeds and falls back to `polign` on PATH.
    "polign_db>=0.7.2; (sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64')",
]

[project.urls]
Repository = "https://github.com/Polign/recall"

[tool.setuptools.package-data]
polign_recall = ["py.typed"]
