[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polign-recall"
version = "0.21.0"
description = "Typed, correctable agent memory through Recall's MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Polign"}]
dependencies = []

[project.optional-dependencies]
# `polign-server`, the database `Client(local_dir=...)` runs, as platform
# wheels. Only a managed local store needs it: a client that connects to a
# `recall serve` or to POLIGN_URL does not, so it is an extra rather than a
# dependency. The marker covers exactly the platforms those wheels exist for,
# so `polign-recall[local]` anywhere else still installs. The `recall` binary
# itself ships inside this package's own platform wheels.
local = [
    "polign_db>=0.12.0; (sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64')",
]

[project.urls]
Repository = "https://github.com/Polign/recall"

[tool.setuptools.package-data]
polign_recall = ["py.typed"]
