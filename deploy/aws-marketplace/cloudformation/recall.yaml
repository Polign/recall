AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Recall agent memory on a single EC2 instance, with polign_db as its store on
  the same instance, the S3 bucket that backs it, an instance role scoped to
  that bucket, and a security group scoped to a CIDR you name. Recall listens
  on port 8080; the database listens on localhost only.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: AWS Marketplace Parameters}
        Parameters: [ImageId]
      - Label: {default: Network}
        Parameters: [VpcId, SubnetIds, AllowedCidr, CreateLoadBalancer]
      - Label: {default: Instance}
        Parameters: [InstanceType, VolumeSize, KeyName]
      - Label: {default: Storage}
        Parameters: [BucketName, StorePrefix, DiskCacheBytes, StoreRoleArn, StoreExternalId]
      - Label: {default: Memory}
        Parameters: [EmbedModel]
    ParameterLabels:
      AllowedCidr: {default: CIDR allowed to reach Recall}
      StoreRoleArn: {default: Role to assume for a bucket in another account}

Parameters:
  # AWS Marketplace replaces this parameter with a Systems Manager parameter
  # that resolves to the published AMI for the buyer's Region, so it must stay
  # a parameter reference and must not be a region mapping.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: AMI to launch. The listing supplies it.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Subnets. The instance launches in the first one, so prefer a private
      subnet with a NAT gateway or an S3 gateway endpoint. A load balancer, if
      you enable one, spans all of them.

  AllowedCidr:
    Type: String
    Description: >-
      CIDR allowed to reach Recall on port 8080. Use your VPC CIDR. Every
      request also needs a Recall key; this network rule is an independent
      boundary that keeps memory private.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a CIDR block, for example 10.0.0.0/16.

  CreateLoadBalancer:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      Put an internal network load balancer in front, giving you a DNS name
      that survives replacing the instance. Adds the usual NLB hourly cost.

  InstanceType:
    Type: String
    Default: m7g.large
    AllowedValues:
      - t4g.medium
      - m7g.large
      - m7g.xlarge
      - m7g.2xlarge
      - r7g.large
      - r7g.xlarge
      - r7g.2xlarge
    Description: >-
      Graviton instance type. The built-in embedder runs on the CPU, and the
      database keeps its hot tier in memory.

  VolumeSize:
    Type: Number
    Default: 100
    MinValue: 30
    MaxValue: 16000
    Description: >-
      Root volume in GiB. It holds the local disk cache tier, so keep it
      comfortably above DiskCacheBytes.

  DiskCacheBytes:
    Type: Number
    Default: 10737418240
    MinValue: 1073741824
    Description: Byte budget for the local disk cache under /var/cache/polign.

  KeyName:
    Type: String
    Default: ""
    Description: >-
      Optional EC2 key pair for SSH. Leave empty: the instance registers with
      Systems Manager, so you can reach it with Session Manager without opening
      port 22.

  BucketName:
    Type: String
    Default: ""
    Description: >-
      Existing S3 bucket to store into. Leave empty to have this stack create
      one and delete nothing on teardown.

  StorePrefix:
    Type: String
    Default: recall
    Description: Key prefix inside the bucket.

  StoreRoleArn:
    Type: String
    Default: ""
    Description: >-
      Optional. Leave empty when the bucket is in this account: the instance
      role below is granted it directly, and no credential exists anywhere.
      For a bucket in ANOTHER account, which this account cannot grant, name a
      role there instead. The instance role is allowed to assume it, and the
      server signs every request with the short-lived credentials it returns.
      Give the bucket's name in BucketName, and trust this stack's
      InstanceRoleArn output from the role's trust policy.
    AllowedPattern: ^$|^arn:aws[a-z-]*:iam::\d{12}:role/.+$
    ConstraintDescription: Must be empty or an IAM role ARN.

  StoreExternalId:
    Type: String
    Default: ""
    Description: >-
      Optional external id sent on the StoreRoleArn AssumeRole call, when that
      role's trust policy requires one. Ignored without StoreRoleArn.

  EmbedModel:
    Type: String
    Default: local:all-minilm-l6-v2
    Description: >-
      Embedder for search by meaning. The default runs inside the image with
      no API key. "lexical" is word search only. A hosted embedder such as
      openai:text-embedding-3-small@512 also needs its API key in
      /etc/recall/recall.env. Choose before the first write.

Rules:
  CrossAccountBucketIsNamed:
    RuleCondition: !Not [!Equals [!Ref StoreRoleArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref BucketName, ""]]
        AssertDescription: >-
          StoreRoleArn names a role in the account that owns the bucket, so
          that bucket already exists somewhere this stack cannot create one.
          Put its name in BucketName.

  DataPlaneIsNotPublic:
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedCidr, "0.0.0.0/0"]]
        AssertDescription: >-
          Key authentication does not make a memory server safe to expose
          directly to the internet. Name your VPC CIDR instead.

Conditions:
  CreateBucket: !Equals [!Ref BucketName, ""]
  AssumesStoreRole: !Not [!Equals [!Ref StoreRoleArn, ""]]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  WantsLoadBalancer: !Equals [!Ref CreateLoadBalancer, "yes"]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub
        - recall-${AWS::AccountId}-${Suffix}
        - Suffix: !Select [2, !Split ["/", !Ref AWS::StackId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager access, so day-2 work needs no inbound port.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # Assuming the store role is the cross-account path: the bucket policy
        # below then grants nothing (the bucket is not in this account) and the
        # grant that matters lives on the role over there.
        - !If
          - AssumesStoreRole
          - PolicyName: recall-assume-store-role
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Ref StoreRoleArn
          - !Ref AWS::NoValue
        - PolicyName: recall-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${B}/*
                  - B: !If [CreateBucket, !Ref Bucket, !Ref BucketName]
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${B}
                  - B: !If [CreateBucket, !Ref Bucket, !Ref BucketName]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Recall, reachable only from AllowedCidr
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedCidr
          Description: Recall HTTP and MCP
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-recall"}

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref SecurityGroup]
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-recall"}
        - Key: recall:store
          Value: !Sub
            - s3://${B}/${StorePrefix}
            - B: !If [CreateBucket, !Ref Bucket, !Ref BucketName]
      UserData:
        Fn::Base64: !Sub
          - |
            #cloud-config
            write_files:
              - path: /etc/recall/recall.env
                owner: root:root
                permissions: "0600"
                content: |
                  POLIGN_STORE=s3://${B}/${StorePrefix}
                  POLIGN_STORE_ROLE_ARN=${StoreRoleArn}
                  POLIGN_STORE_EXTERNAL_ID=${StoreExternalId}
                  AWS_REGION=${AWS::Region}
                  POLIGN_DISK_CACHE_BYTES=${DiskCacheBytes}
                  POLIGN_EMBED_MODEL=${EmbedModel}
          - B: !If [CreateBucket, !Ref Bucket, !Ref BucketName]

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: WantsLoadBalancer
    Properties:
      Type: network
      # Internal on purpose. See the AllowedCidr rule above.
      Scheme: internal
      Subnets: !Ref SubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: WantsLoadBalancer
    Properties:
      VpcId: !Ref VpcId
      Protocol: TCP
      Port: 8080
      TargetType: instance
      Targets: [{Id: !Ref Instance}]
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckPort: "8080"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: WantsLoadBalancer
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TCP
      Port: 8080
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

Outputs:
  StoreSpec:
    Description: The store this deployment writes to.
    Value: !Sub
      - s3://${B}/${StorePrefix}
      - B: !If [CreateBucket, !Ref Bucket, !Ref BucketName]

  BucketName:
    Description: Bucket backing the deployment. A stack-created bucket is retained on delete.
    Value: !If [CreateBucket, !Ref Bucket, !Ref BucketName]

  InstanceId:
    Value: !Ref Instance

  InstanceRoleArn:
    Description: >-
      The principal this instance runs as. Trust it from the role named in
      StoreRoleArn when the bucket lives in another account.
    Value: !GetAtt InstanceRole.Arn

  StorePrincipal:
    Description: The identity the server reaches its bucket as.
    Value: !If [AssumesStoreRole, !Ref StoreRoleArn, !GetAtt InstanceRole.Arn]

  RecallEndpoint:
    Description: >-
      Base URL for Recall's HTTP API (/v1/...) and MCP endpoint (/mcp),
      reachable from AllowedCidr.
    Value: !If
      - WantsLoadBalancer
      - !Sub "http://${LoadBalancer.DNSName}:8080"
      - !Sub "http://${Instance.PrivateIp}:8080"

  SessionManagerCommand:
    Description: Open a shell on the instance without an inbound port.
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}"

  AdminKeyCommand:
    Description: >-
      Print the instance's first Recall admin key, which mints namespace keys
      for your applications (POST /v1/keys). Run it in the Session Manager shell.
    Value: sudo cat /etc/recall/admin-key
