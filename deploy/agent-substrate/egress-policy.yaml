# One actor's egress policy, for `kubectl ate create egress-policy <actor> -f`.
# The actor may reach Recall and, for check 10 only, the polign_db it holds
# an agent against in process. On a request to Recall the gateway replaces
# the Authorization header with a JWT minted for the actor.
rules:
- http:
    hostnames: ["recall.recall-system.svc.cluster.local"]
    effects:
      replaceHeaders:
      - header: Authorization
        prefix: "Bearer "
        actorJwt:
          audiences: ["recall"]
          expirationSeconds: 900
- http:
    hostnames: ["polign.recall-system.svc.cluster.local"]
