# A polign_db for check 10, which holds an agent inside the actor through the
# Go client instead of through recall serve. Data is local to the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polign
  namespace: recall-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: polign}
  template:
    metadata:
      labels: {app: polign}
    spec:
      containers:
      - name: polign
        image: ghcr.io/polign/polign-server:0.16.0
        args: ["-store", "fs:/data", "-http", ":23000", "-telemetry=false"]
        ports:
        - containerPort: 23000
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: polign
  namespace: recall-system
spec:
  selector: {app: polign}
  ports:
  - port: 80
    targetPort: 23000
